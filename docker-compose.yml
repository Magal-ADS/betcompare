name: betcompare

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8010:8000"
    environment:
      APP_ENV: local
      APP_DEBUG: "true"
      APP_URL: http://localhost:8010
      DB_CONNECTION: pgsql
      DB_HOST: db
      DB_PORT: 5432
      DB_DATABASE: betcompare
      DB_USERNAME: betcompare
      DB_PASSWORD: betcompare
    volumes:
      - .:/var/www/html
    depends_on:
      db:
        condition: service_healthy

  test:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      APP_ENV: testing
      DB_CONNECTION: sqlite
      DB_DATABASE: ":memory:"
      CACHE_STORE: array
      SESSION_DRIVER: array
      QUEUE_CONNECTION: sync
    volumes:
      - .:/var/www/html

  db:
    image: postgres:17
    environment:
      POSTGRES_DB: betcompare
      POSTGRES_USER: betcompare
      POSTGRES_PASSWORD: betcompare
    volumes:
      - betcompare_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U betcompare -d betcompare"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s

volumes:
  betcompare_postgres_data:
