name: betcompare

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8010:8000"
    environment:
      APP_ENV: local
      APP_DEBUG: "true"
      APP_URL: http://localhost:8010
      DB_CONNECTION: mysql
      DB_HOST: db
      DB_PORT: 3306
      DB_DATABASE: betcompare
      DB_USERNAME: betcompare
      DB_PASSWORD: betcompare
    volumes:
      - .:/var/www/html
    depends_on:
      db:
        condition: service_healthy

  db:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: betcompare
      MYSQL_USER: betcompare
      MYSQL_PASSWORD: betcompare
      MYSQL_ROOT_PASSWORD: root
    volumes:
      - betcompare_mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-proot"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s

volumes:
  betcompare_mysql_data:
